name: upload reports
description: Carries the reports a build leaves out of the run, so a red run can be read rather than scrolled.

inputs:
  name:
    description: What the artifact holding the reports is called.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        retention-days: 7
        path: |
          build/*.xml
          build/*.tap
          build/*.json
          build/*.checked
          build/*.txt
