name: judge

# The PR's code, judged by main's gates. pull_request_target always runs this
# file as it is on main, so a pull request cannot change the workflow that
# judges it. The PR's tree is checked out as the thing under test; gates/ --
# every list, stat, report recipe, threshold and check -- is then replaced by
# main's copy. A change to a gate therefore merges on its own, judged by the
# gates it replaces.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}
  ROOT_DIR: ${{ github.workspace }}
  # Files that could silence a gate, or that make would read ahead of Makefile.
  # None may differ from main.
  TOOL_CONFIG: '(^|/)(\.shellcheckrc|shellcheckrc|\.semgrepignore|checkmake\.ini|\.checkmake\.ini)$|^(GNUmakefile|makefile)$'

defaults:
  run:
    shell: bash

jobs:
  judge:
    name: judge
    # Fork PRs never run in this job: it would execute their code in main's context.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: debian:testing-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .judge
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - name: no tool configuration differs from main
        run: |
          set -euo pipefail
          { git ls-files; git -C .judge ls-files; } | sort -u > "$RUNNER_TEMP/files.txt"
          found=0
          grep -E "$TOOL_CONFIG" "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/tool-config.txt" || found=$?
          [ "$found" -le 1 ]
          while read -r f; do
            cmp -s "$f" ".judge/$f" || { echo "judge: $f differs from main"; exit 1; }
          done < "$RUNNER_TEMP/tool-config.txt"
          echo "judge: $(wc -l < "$RUNNER_TEMP/tool-config.txt") tool configuration files, all as on main"
      - name: gates/ is main's
        run: |
          set -euo pipefail
          rm -rf gates
          cp -Rp .judge/gates gates
          echo "judge: gates/ taken from main $(git -C .judge rev-parse --short HEAD)"
          rm -rf .judge
      - name: the gates run, and nothing outside gates/ redefines one
        run: |
          set -euo pipefail
          make build/lint.checked build/unit.txt build 2>&1 | tee "$RUNNER_TEMP/make.log"
          found=0
          grep -E 'overriding (recipe|commands)|ignoring old (recipe|commands)' "$RUNNER_TEMP/make.log" > "$RUNNER_TEMP/redefined.txt" || found=$?
          [ "$found" -le 1 ]
          echo "judge: $(wc -l < "$RUNNER_TEMP/redefined.txt") gate recipes redefined (max 0)"
          [ "$(wc -l < "$RUNNER_TEMP/redefined.txt")" -le 0 ]
      - name: only gates/ sets override variables
        run: |
          set -euo pipefail
          status=0
          make -p -q build/stats.txt > "$RUNNER_TEMP/make-database.txt" 2>/dev/null || status=$?
          [ "$status" -le 1 ]
          found=0
          grep -E "^# [\`']override' directive \(from [\`']" "$RUNNER_TEMP/make-database.txt" > "$RUNNER_TEMP/overrides.txt" || found=$?
          [ "$found" -le 1 ]
          found=0
          grep -v -E "from [\`']($ROOT_DIR/)?gates/" "$RUNNER_TEMP/overrides.txt" > "$RUNNER_TEMP/outside.txt" || found=$?
          [ "$found" -le 1 ]
          cat "$RUNNER_TEMP/outside.txt"
          echo "judge: $(wc -l < "$RUNNER_TEMP/outside.txt") override variables set outside gates/, $(wc -l < "$RUNNER_TEMP/overrides.txt") in all (max 0 outside)"
          [ "$(wc -l < "$RUNNER_TEMP/outside.txt")" -le 0 ] && [ "$(wc -l < "$RUNNER_TEMP/overrides.txt")" -gt 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-reports
          retention-days: 7
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.log
            build/*.checked
            build/*.txt

  judge-macos:
    name: judge macOS
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .judge
          persist-credentials: false
      - name: no tool configuration differs from main
        run: |
          set -euo pipefail
          { git ls-files; git -C .judge ls-files; } | sort -u > "$RUNNER_TEMP/files.txt"
          found=0
          grep -E "$TOOL_CONFIG" "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/tool-config.txt" || found=$?
          [ "$found" -le 1 ]
          while read -r f; do
            cmp -s "$f" ".judge/$f" || { echo "judge: $f differs from main"; exit 1; }
          done < "$RUNNER_TEMP/tool-config.txt"
          echo "judge: $(wc -l < "$RUNNER_TEMP/tool-config.txt") tool configuration files, all as on main"
      - name: gates/ is main's
        run: |
          set -euo pipefail
          rm -rf gates
          cp -Rp .judge/gates gates
          echo "judge: gates/ taken from main $(git -C .judge rev-parse --short HEAD)"
          rm -rf .judge
      - name: the gates run, and nothing outside gates/ redefines one
        run: |
          set -euo pipefail
          make build/lint.checked build/unit.txt build 2>&1 | tee "$RUNNER_TEMP/make.log"
          found=0
          grep -E 'overriding (recipe|commands)|ignoring old (recipe|commands)' "$RUNNER_TEMP/make.log" > "$RUNNER_TEMP/redefined.txt" || found=$?
          [ "$found" -le 1 ]
          echo "judge: $(wc -l < "$RUNNER_TEMP/redefined.txt") gate recipes redefined (max 0)"
          [ "$(wc -l < "$RUNNER_TEMP/redefined.txt")" -le 0 ]
      - name: only gates/ sets override variables
        run: |
          set -euo pipefail
          status=0
          make -p -q build/stats.txt > "$RUNNER_TEMP/make-database.txt" 2>/dev/null || status=$?
          [ "$status" -le 1 ]
          found=0
          grep -E "^# [\`']override' directive \(from [\`']" "$RUNNER_TEMP/make-database.txt" > "$RUNNER_TEMP/overrides.txt" || found=$?
          [ "$found" -le 1 ]
          found=0
          grep -v -E "from [\`']($ROOT_DIR/)?gates/" "$RUNNER_TEMP/overrides.txt" > "$RUNNER_TEMP/outside.txt" || found=$?
          [ "$found" -le 1 ]
          cat "$RUNNER_TEMP/outside.txt"
          echo "judge: $(wc -l < "$RUNNER_TEMP/outside.txt") override variables set outside gates/, $(wc -l < "$RUNNER_TEMP/overrides.txt") in all (max 0 outside)"
          [ "$(wc -l < "$RUNNER_TEMP/outside.txt")" -le 0 ] && [ "$(wc -l < "$RUNNER_TEMP/overrides.txt")" -gt 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-reports-macos
          retention-days: 7
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.log
            build/*.checked
            build/*.txt
