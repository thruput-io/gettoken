name: judge

# The PR's code, judged by main's gates. pull_request_target always runs this
# file as it is on main, so a pull request cannot change the workflow that
# judges it. The PR's tree is checked out as the thing under test; every file
# that decides pass or fail is then replaced by main's copy. A change to a gate
# therefore has to merge on its own, judged by the gates it replaces.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}
  ROOT_DIR: ${{ github.workspace }}
  # Every file that judges rather than builds. Each one is taken from main.
  GATE_FILES: >-
    Makefile
    stats.mk
    dynamic.sh
    constants.env
    scripts/branching.sh
    scripts/check-permissions.sh
    scripts/fetch-semgrep-bash.sh
    scripts/semgrep-shim.sh
    scripts/readme.sh
    scripts/versions.sh
  # Files that could silence a gate or take make's place ahead of Makefile.
  # None may differ from main.
  TOOL_CONFIG: '(^|/)(\.shellcheckrc|shellcheckrc|\.semgrepignore|checkmake\.ini|\.checkmake\.ini)$|^(GNUmakefile|makefile)$'

defaults:
  run:
    shell: bash

jobs:
  judge:
    name: judge
    # Fork PRs never run in this job: it would execute their code in main's context.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: debian:testing-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .judge
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - name: no tool configuration differs from main
        run: |
          set -euo pipefail
          { git ls-files; git -C .judge ls-files; } | sort -u > "$RUNNER_TEMP/files.txt"
          found=0
          grep -E "$TOOL_CONFIG" "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/tool-config.txt" || found=$?
          [ "$found" -le 1 ]
          while read -r f; do
            cmp -s "$f" ".judge/$f" || { echo "judge: $f differs from main"; exit 1; }
          done < "$RUNNER_TEMP/tool-config.txt"
          echo "judge: $(wc -l < "$RUNNER_TEMP/tool-config.txt") tool configuration files, all as on main"
      - name: the gates are main's
        run: |
          set -euo pipefail
          for f in $GATE_FILES; do
            cp -p ".judge/$f" "$f"
            echo "judge: $f taken from main $(git -C .judge rev-parse --short HEAD)"
          done
          rm -rf .judge
      - run: make build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-reports
          retention-days: 7
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.log
            build/*.checked
            build/*.txt

  judge-macos:
    name: judge macOS
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .judge
          persist-credentials: false
      - name: no tool configuration differs from main
        run: |
          set -euo pipefail
          { git ls-files; git -C .judge ls-files; } | sort -u > "$RUNNER_TEMP/files.txt"
          found=0
          grep -E "$TOOL_CONFIG" "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/tool-config.txt" || found=$?
          [ "$found" -le 1 ]
          while read -r f; do
            cmp -s "$f" ".judge/$f" || { echo "judge: $f differs from main"; exit 1; }
          done < "$RUNNER_TEMP/tool-config.txt"
          echo "judge: $(wc -l < "$RUNNER_TEMP/tool-config.txt") tool configuration files, all as on main"
      - name: the gates are main's
        run: |
          set -euo pipefail
          for f in $GATE_FILES; do
            cp -p ".judge/$f" "$f"
            echo "judge: $f taken from main $(git -C .judge rev-parse --short HEAD)"
          done
          rm -rf .judge
      - run: make build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-reports-macos
          retention-days: 7
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.log
            build/*.checked
            build/*.txt
