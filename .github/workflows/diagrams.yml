name: diagrams

on:
  pull_request:
    paths:
      - README.md
      - scripts/mermaid.sh
      - scripts/fixtures/**
      - .github/workflows/diagrams.yml
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/mermaid.sh
      - scripts/fixtures/**
      - .github/workflows/diagrams.yml

jobs:
  render:
    name: README diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make diagrams
