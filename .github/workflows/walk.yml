name: walk

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chain:
    name: chain runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh test/walk.sh

  diagrams:
    name: README diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sh test/mermaid.sh
