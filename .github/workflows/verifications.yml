name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,           os: macos-latest,  target: check,           brew: true }
          - { name: Debian,          os: ubuntu-latest, target: debian,          brew: false }
          - { name: Debian packages, os: ubuntu-latest, target: debian-packages, brew: false }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.brew
        run: brew install jq bats-core shellcheck go
      - run: make ${{ matrix.target }}
