name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make unit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt

  build:
    name: build
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - name: let the archive sign with the key it always signs with
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
        run: |
          printf '%s' "$ARCHIVE_SIGNING_KEY" > "$HOME/.gettoken-archive-key.asc"
          {
            echo 'ARCHIVE_SIGNING_KEY=$(cat "$HOME/.gettoken-archive-key.asc")'
            echo 'export ARCHIVE_SIGNING_KEY'
          } > config.local.sh
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-slim
            os: ubuntu-latest
            container: ubuntu:24.04
            install: apt-get install -y --no-install-recommends
            reach-the-archive: |
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates
              curl -fsS "$SITE_URL/apt/dists/$BRANCH/gettoken.sources" \
                -o /etc/apt/sources.list.d/gettoken.sources
              apt-get update -o APT::Update::Error-Mode=any
          - platform: ubuntu-26.04
            os: ubuntu-latest
            container: ''
            install: sudo apt-get install -y --no-install-recommends
            reach-the-archive: |
              sudo curl -fsS "$SITE_URL/apt/dists/$BRANCH/gettoken.sources" \
                -o /etc/apt/sources.list.d/gettoken.sources
              sudo apt-get update -o APT::Update::Error-Mode=any
          - platform: macos-26
            os: macos-15
            container: ''
            install: brew install --no-ask
            reach-the-archive: |
              echo "nothing points a Mac at an apt archive; issue #44 says what would"
    steps:
      - uses: actions/checkout@v4
      - name: point this machine at the archive it installs from
        env:
          SITE_URL: https://thruput.se/gettoken
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ${{ matrix.reach-the-archive }}
      - run: make test
        env:
          INSTALL_COMMAND: ${{ matrix.install }}
