name: verifications

on:
  pull_request:
  push:
    branches: [main]

env:
  BUILD_NUMBER: ${{ github.run_number }}
  ROOT_DIR: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container: debian:testing-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: Debian stable
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - run: |
          tar -cf - constants.env version.txt dynamic.sh src/integration-test/test.sh build/dist/deb \
            | docker run -i --rm -e ROOT_DIR=/work -e BUILD_NUMBER \
              debian:testing-slim bash -c '
                mkdir -p /work && cd /work && tar xf -
                source dynamic.sh && bash src/integration-test/test.sh build/dist'

  release:
    name: release
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dynamic.sh > /dev/null
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
            build/dist/deb/*.deb build/dist/brew/*.tar.gz build/dist/brew/*.rb

  macos:
    name: macOS stable
    needs: build
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: verify dynamic configuration
        run: |
          source dynamic.sh
