name: verifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}
  ROOT_DIR: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container: debian:testing-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make build
      - if: always()
        uses: ./.github/actions/upload-reports
        with:
          name: reports
      - uses: actions/upload-artifact@v4
        with:
          name: dist-debian
          path: build/dist
          retention-days: 7

  build-macos:
    name: build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - if: always()
        uses: ./.github/actions/upload-reports
        with:
          name: reports-macos
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: build/dist
          retention-days: 7

  integration:
    name: ${{ matrix.name }}
    needs: [build, build-macos]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian stable, os: ubuntu-latest, container: 'debian:testing-slim', dist: dist-debian }
          - { name: macOS stable,  os: macos-latest,  container: '',                    dist: dist-macos }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.dist }}
          path: build/dist
      - run: source dynamic.sh > /dev/null && bash scripts/add-archive.sh
      - run: source dynamic.sh > /dev/null && bash src/integration-test/test.sh

