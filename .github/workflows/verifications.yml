name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    container: debian:testing-slim
    steps:
      - uses: actions/checkout@v4
      - run: scripts/bootstrap.sh
      - run: make setup
      - run: make unit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt

  build:
    name: build
    needs: unit
    runs-on: ubuntu-latest
    container: debian:testing-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/bootstrap.sh
      - run: make setup
      - run: make build BRANCH="${{ github.head_ref || github.ref_name }}"
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: ${{ matrix.container }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        container:
          - node:26-slim
    steps:
      - uses: actions/checkout@v4
      - name: point this machine at the archive it installs from
        env:
          SITE_URL: https://thruput.se/gettoken
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          scripts/bootstrap.sh
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsS "$SITE_URL/apt/dists/$BRANCH/gettoken.sources" \
            -o /etc/apt/sources.list.d/gettoken.sources
          apt-get update -o APT::Update::Error-Mode=any
      - run: make test

  macos:
    name: macos-26
    needs: build
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: echo "nothing points a Mac at an apt archive; issue #44 says what would"
      - run: cp config.local.sh.mac.example config.local.sh
      - run: make test
