name: verifications

on:
  pull_request:
  push:
    branches: [main]

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}
  ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
  BUILD_NUMBER: ${{ github.run_number }}
  ROOT_DIR: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container: debian:testing-slim
    permissions:
      contents: write
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make build
      - name: cut and push a release tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          source dynamic.sh
          bash scripts/tag-release.sh "v$VERSION" "$GITHUB_REPOSITORY" build/brew-sha256.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: Debian stable
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar -cf - constants.env dynamic.sh src/integration-test/test.sh \
            | docker run -i --rm -e CI=true -e ROOT_DIR=/work -e BRANCH -e ARCHIVE_SIGNING_KEY \
              debian:testing-slim bash -c '
                mkdir -p /work && cd /work && tar xf -
                source dynamic.sh && bash src/integration-test/test.sh'

  macos:
    name: macOS stable
    needs: build
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: verify dynamic configuration
        run: |
          source dynamic.sh
