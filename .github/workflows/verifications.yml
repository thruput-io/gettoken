name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS stable,    os: macos-15,      target: check,           blocking: true,  brew: true }
          - { name: macOS latest,    os: macos-latest,  target: check,           blocking: false, brew: true }
          - { name: Debian stable,   os: ubuntu-latest, target: debian-stable,   blocking: true,  brew: false }
          - { name: Debian latest,   os: ubuntu-latest, target: debian-latest,   blocking: false, brew: false }
          - { name: Debian packages, os: ubuntu-latest, target: debian-packages, blocking: true,  brew: false }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.brew
        run: brew install jq bats-core cpanminus && cpanm --notest JSON::Schema::Modern
      - run: make ${{ matrix.target }}
