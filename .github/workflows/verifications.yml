name: verifications

on:
  pull_request:
  push:
    branches: [main]

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}
  SITE_URL: https://thruput.se/gettoken

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container: debian:testing-slim
    permissions:
      contents: write
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
      - run: make build BRANCH="$BRANCH" SITE_URL="$SITE_URL"
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: ${{ matrix.container }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - node:26-slim
    steps:
      - uses: actions/checkout@v4
      - name: run integration test
        run: bash src/integration-test/test.sh "apt-get update && apt-get install -y --no-install-recommends" "$BRANCH" "$SITE_URL"

  macos:
    name: macos-26
    needs: build
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: run integration test
        run: bash src/integration-test/test.sh "brew install --no-ask" "$BRANCH" "$SITE_URL"
