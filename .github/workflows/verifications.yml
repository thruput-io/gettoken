name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make unit

  integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-slim
            os: ubuntu-latest
            install: sudo apt-get install -y --no-install-recommends
            unprivileged: nobody
          - name: ubuntu-26.04
            os: ubuntu-latest
            install: sudo apt-get install -y --no-install-recommends
            unprivileged: nobody
          - name: macos-26
            os: macos-15
            install: brew install --no-ask
            unprivileged: nobody
    steps:
      - uses: actions/checkout@v4
      - run: make setup
        env:
          INSTALL_COMMAND: ${{ matrix.install }}
      - run: ./integration-test/test.sh "${{ matrix.install }}" "${{ matrix.unprivileged }}"
