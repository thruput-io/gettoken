name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS stable,  os: macos-15,      platform: macos-26,      target: unit }
          - { name: macOS latest,  os: macos-latest,  platform: macos-26,      target: unit }
          - { name: Debian stable, os: ubuntu-latest, platform: ubuntu-slim,   target: test }
          - { name: deb-testing,   os: ubuntu-latest, platform: ubuntu-26.04,  target: test }
    steps:
      - uses: actions/checkout@v4
      - run: make setup GETTOKEN_PLATFORM=${{ matrix.platform }}
      - run: make ${{ matrix.target }} GETTOKEN_PLATFORM=${{ matrix.platform }}
