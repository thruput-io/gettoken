name: verifications

on:
  pull_request:
  push:
    branches: [main]

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container: debian:testing-slim
    permissions:
      contents: write
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make build
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  test:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-testing-slim
            runs-on: ubuntu-latest
            container: debian:testing-slim
          - name: macos-latest
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: run integration test
        run: |
          source ./dynamic.sh
          bash src/integration-test/test.sh

