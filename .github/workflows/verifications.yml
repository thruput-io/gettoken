name: verifications

on:
  pull_request:
  push:
    branches: [main]

env:
  BUILD_NUMBER: ${{ github.run_number }}
  ROOT_DIR: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-in-container.sh build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: Debian stable
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - run: bash scripts/verify-in-container.sh build/dist

  macos:
    name: macOS stable
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - run: |
          work=$(mktemp -d)
          bash scripts/payload.sh build/dist | tar -xf - -C "$work"
          bash "$work/src/integration-test/clean-machine.sh" dist

  release:
    name: release
    needs: [integration, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dynamic.sh > /dev/null
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
            build/dist/deb/*.deb build/dist/brew/*.tar.gz build/dist/brew/*.rb
      - id: distribute
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISTRIBUTE_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: apt,homebrew-tap
      - name: tell the distribution repositories there is a release
        env:
          GH_TOKEN: ${{ steps.distribute.outputs.token }}
        run: |
          for repo in apt homebrew-tap; do
            gh api "repos/$GITHUB_REPOSITORY_OWNER/$repo/dispatches" \
              -f event_type=release -f "client_payload[repository]=$GITHUB_REPOSITORY"
          done

