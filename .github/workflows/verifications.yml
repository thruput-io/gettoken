name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.platform }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-26,     os: macos-15,      make: unit }
          - { platform: macos-26,     os: macos-latest,  make: unit }
          - { platform: ubuntu-slim,  os: ubuntu-latest, make: test }
          - { platform: ubuntu-26.04, os: ubuntu-latest, make: test }
    steps:
      - uses: actions/checkout@v4
      - run: make setup GETTOKEN_PLATFORM=${{ matrix.platform }}
      - run: make ${{ matrix.make }} GETTOKEN_PLATFORM=${{ matrix.platform }}
