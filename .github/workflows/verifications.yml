name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container: debian:testing-slim
    permissions:
      contents: write
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make build BRANCH="${{ github.head_ref || github.ref_name }}" SITE_URL="https://thruput.se/gettoken"
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: ${{ matrix.container }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - node:26-slim
    steps:
      - uses: actions/checkout@v4
      - name: run integration test
        run: bash src/integration-test/test.sh "apt-get update && apt-get install -y --no-install-recommends" "${{ github.head_ref || github.ref_name }}" "https://thruput.se/gettoken"

  macos:
    name: macos-26
    needs: build
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: run integration test
        run: bash src/integration-test/test.sh "brew install --no-ask" "${{ github.head_ref || github.ref_name }}" "https://thruput.se/gettoken"
