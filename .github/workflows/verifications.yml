name: verifications

on:
  pull_request:
  push:
    branches: [main]

env:
  BUILD_NUMBER: ${{ github.run_number }}
  ROOT_DIR: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container: debian:testing-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist-debian
          path: build/dist

  build-macos:
    name: build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-macos
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: build/dist

  integration:
    name: Debian stable
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-debian
          path: build/dist
      - run: |
          tar -cf - constants.env version.txt dynamic.sh src/integration-test build/dist \
            | docker run -i --rm -e ROOT_DIR=/work -e BUILD_NUMBER \
              debian:testing-slim bash -c '
                mkdir -p /work && cd /work && tar xf -
                source dynamic.sh > /dev/null && bash src/integration-test/test.sh build/dist'

  macos:
    name: macOS stable
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: build/dist
      - run: source dynamic.sh > /dev/null && bash src/integration-test/test.sh build/dist

  release:
    name: release
    needs: [integration, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: build/dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dynamic.sh > /dev/null
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
            build/dist/deb/*.deb build/dist/brew/*.tar.gz build/dist/brew/*.rb
      - id: distribute
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISTRIBUTE_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: apt,homebrew-tap
      - name: tell the distribution repositories there is a release
        env:
          GH_TOKEN: ${{ steps.distribute.outputs.token }}
        run: |
          for repo in apt homebrew-tap; do
            gh api "repos/$GITHUB_REPOSITORY_OWNER/$repo/dispatches" \
              -f event_type=release -f "client_payload[repository]=$GITHUB_REPOSITORY"
          done

