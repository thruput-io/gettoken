name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make unit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/*.xml
            build/*.tap
            build/*.json
            build/*.checked
            build/*.txt

  build:
    name: build
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - name: let the archive sign with the key it always signs with
        env:
          ARCHIVE_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
        run: |
          printf 'export ARCHIVE_SIGNING_KEY=%q\n' "$ARCHIVE_SIGNING_KEY" > config.local.sh
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist

  integration:
    name: ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-slim
            os: ubuntu-latest
            container: ubuntu:24.04
            install: apt-get install -y --no-install-recommends
            reach-the-archive: |
              mkdir -p /etc/apt/keyrings
              cp build/dist/deb/gettoken-archive-keyring.pgp /etc/apt/keyrings/
              printf 'deb [signed-by=/etc/apt/keyrings/gettoken-archive-keyring.pgp] file:%s/build/dist/deb ./\n' "$PWD" \
                > /etc/apt/sources.list.d/gettoken.list
              apt-get update
          - platform: ubuntu-26.04
            os: ubuntu-latest
            container: ''
            install: sudo apt-get install -y --no-install-recommends
            reach-the-archive: |
              sudo mkdir -p /etc/apt/keyrings
              sudo cp build/dist/deb/gettoken-archive-keyring.pgp /etc/apt/keyrings/
              printf 'deb [signed-by=/etc/apt/keyrings/gettoken-archive-keyring.pgp] file:%s/build/dist/deb ./\n' "$PWD" \
                | sudo tee /etc/apt/sources.list.d/gettoken.list
              sudo apt-get update
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - name: point this machine at the archive it installs from
        run: ${{ matrix.reach-the-archive }}
      - run: make test
        env:
          INSTALL_COMMAND: ${{ matrix.install }}
