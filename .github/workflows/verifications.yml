name: verifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS stable, os: macos-15,      target: test,        brew: true }
          - { name: macOS latest, os: macos-latest,  target: test,        brew: true }
          - { name: Debian stable, os: ubuntu-latest, target: deb-stable,  brew: false }
          - { name: deb-testing,  os: ubuntu-latest, target: deb-testing, brew: false }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.brew
        run: brew install jq bats-core shellcheck go
      - run: make ${{ matrix.target }}
