name: gpg

on:
  workflow_dispatch:

jobs:
  key:
    name: Generate the key the archive is signed with
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HEMMING_APP_ID }}
          private-key: ${{ secrets.HEMMING_PRIVATE_KEY }}

      - name: Generate and store GPG secret
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail

          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"

          gpg --batch --quiet --pinentry-mode loopback --passphrase '' \
              --quick-generate-key 'gettoken archive <johan.granlund@thruput.se>' \
              default default never

          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')

          gpg --batch --quiet --armor --export-secret-keys "$key" > "$GNUPGHOME/secret.asc"
          test -s "$GNUPGHOME/secret.asc"

          gh secret set ARCHIVE_SIGNING_KEY --repo "$GITHUB_REPOSITORY" < "$GNUPGHOME/secret.asc"
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^ARCHIVE_SIGNING_KEY[[:space:]]'
