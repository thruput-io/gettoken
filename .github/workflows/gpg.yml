name: gpg

on:
  workflow_dispatch:

jobs:
  key:
    name: Generate the key the archive is signed with
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HEMMING_APP_ID }}
          private-key: ${{ secrets.HEMMING_PRIVATE_KEY }}

      - name: Generate and store GPG secret
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail

          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT

          bash scripts/generate-key.sh "$keyfile"
          test -s "$keyfile"

          gh secret set ARCHIVE_SIGNING_KEY --repo "$GITHUB_REPOSITORY" < "$keyfile"
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^ARCHIVE_SIGNING_KEY[[:space:]]'
